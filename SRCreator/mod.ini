[mod]
name = SR Creator
author = 00xJS
version = 0.2
description = Build stunt parks in the city from 26 kinds of piece: ramps, kickers, curves, a half pipe, platforms, bridges, blocks, towers, walls, a drum and stairs. F7 or LB + Back turns it on; F6 or Back flies a build camera; the controls show on screen. Builds clear when the game closes: save one from the tweak menu's Creator tab to keep it. Needs sr_alwaysload01.bbchunk_xbox2 made by build_chunk.py. Private play only.
