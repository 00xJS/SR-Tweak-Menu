; Fine Aim - Precision Gunplay by car123609! -
; https://github.com/car123609/SaintsReborn-Fine-Aim-Precision-Gunplay
; Bundled with SR Tweak Menu with the author's permission.
; Switch it on in the menu: Aim tab > Aim style > Fine Aim.
; Restart the game after editing this file.

[settings]
enabled = true
; Windows virtual-key code 2 = right mouse button. Keyboard names also work.
aim_key = 2
; Hold by default; true makes each click toggle fine aim.
toggle_aim = false
; Controller aiming is independent of the mouse setting above.
controller_enabled = true
; true = press once to aim and again to stop; false = hold the aim control.
controller_toggle = true
; RS (right-stick click / R3) or LT (left trigger / L2).
controller_button = RS
; LT press threshold, 0-255. A lower release threshold prevents trigger jitter.
controller_trigger_threshold = 120
; Only the faster run/sprint action (Shift or RB/R1) cancels fine aim.
; Ordinary WASD/left-stick movement remains aimable, including run-named poses.
; Controller toggle stays off after stopping. false allows aim during sprint too.
cancel_when_running = true
; Use native ready movement poses during fine aim, even without firing.
; Yields to reload requests, reload start, and the full native reload animation.
; Reloads and scripted actions keep their own poses. No repeated ready-timer writes.
raise_weapon = true
; Face the character/gun towards camera yaw while fine aiming, including strafes.
face_camera_while_aiming = true
; Extra time the gun remains raised after its firing animation, in milliseconds.
; Applies to normal hip fire too. 0 = no extra delay; 2500 = original game delay.
post_shot_hold_ms = 150
; Not used inside SR Tweak Menu: the menu's Aim tab switches Fine Aim on and off.
enable_key = F8
; Original secondary attack while on foot with a normal gun (hold Alt).
secondary_key = ALT
; Fraction of normal field of view: 0.75 turns 60 degrees into 45.
fov_multiplier = 0.75
; Fraction of normal camera turn speed while aiming, for controller and mouse.
; 0.25 = quarter speed; 0.5 = half speed; 1 = normal. Supported range: 0.05-1.
; Close/restart the game after editing; F8 does not reload settings.
sensitivity_multiplier = 0.40
; Fraction of the normal random shot-spread angle: 0.25 = 75% tighter.
; 0 = no random aiming spread; 1 = normal. Shotgun pellet cones stay intact.
spread_multiplier = 0.25
; Zoom easing time constants, in seconds. 0 makes the transition instant.
aim_in_time = 0.12
aim_out_time = 0.10
; Keep the original right mouse scope control for guns with native zoom.
preserve_native_scopes = true
; Also allow the fine aim camera with rocket launchers.
include_launchers = true
; Log aim transitions and the number of player shots tightened.
debug = false
