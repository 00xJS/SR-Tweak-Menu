; Precise Aim by Eazzy (Eazeepz) - https://github.com/Eazeepz/Precise-Aim
; Bundled with SR Tweak Menu with the author's permission.
; Switch it on in the menu: Aim tab > Aim style > Precise Aim. The camera (preset,
; zoom, field of view, height, shoulder) is tuned in the Aim tab too, so the
; tuning keys are off here (tune_keys = 0). Restart the game after editing this file.

[settings]
; Changes to this file apply while the game is running.
; Keys: a key name (A-Z, 0-9, SPACE, SHIFT, CTRL, ALT, TAB, F1-F12, ...) or a Windows key code
;       (1 = left mouse, 2 = right mouse, 4 = middle mouse, 20 = Caps Lock).
; Controller buttons: A B X Y LB RB LT RT LS RS BACK START DPAD_UP DPAD_DOWN DPAD_LEFT DPAD_RIGHT

; ---------------------------------------------------------------------------
; Main
; ---------------------------------------------------------------------------
; 1 = press aim once to aim, again to stop. 0 = hold to aim.
; Applies to guns, grenades, melee weapons and vehicles.
aim_toggle = 1
; Camera preset to start with, by name from presets.ini or my_presets.ini.
; camera.cfg (written when you tune the camera in game) takes over once it exists.
preset = SR1
; 1 = start the game with slow walk on.
walk_start = 0

; ---------------------------------------------------------------------------
; Sensitivity
; ---------------------------------------------------------------------------
; Your turn speed comes from the game's options: Mouse Sensitivity (OPTIONS > DISPLAY)
; and look sensitivity (OPTIONS > CONTROLS). It is the same on foot, in vehicles,
; aiming or not.
;
; Turn speed while aiming, compared with not aiming (mouse and controller).
; 1.0 = the same, 0.5 = half as fast. Range 0.1 to 3.0.
aim_sensitivity = 1.0
; 1 = while the aim camera zooms in, turning slows by the zoom, so a movement moves
; the view as far on screen as when not aiming. 0 = the view moves faster when zoomed.
aim_zoom_match = 1
; 1 = the mouse follows the game's look sensitivity (OPTIONS > CONTROLS), left / right
; and up / down, on top of Mouse Sensitivity. 0 = Mouse Sensitivity only.
mouse_use_game_sensitivity = 1
; 1 = the controller follows the game's look sensitivity.
pad_use_game_sensitivity = 1

; ---------------------------------------------------------------------------
; Keyboard and mouse
; ---------------------------------------------------------------------------
aim_key = 2
; Slow walk on / off.
walk_toggle_key = 20
; 1 = melee moves from right mouse to melee_key while you hold a gun.
remap_melee = 1
melee_key = X
; Quick toss while a grenade is out. Empty = melee_key.
grenade_toss_key =
; 1 = crouch also works while moving.
crouch_while_moving = 1
crouch_key = C

; ---------------------------------------------------------------------------
; Controller
; ---------------------------------------------------------------------------
; 1 = controller support. Sprint, crouch and the weapon menu follow the
; controller scheme picked in the game's options.
controller = 1
pad_aim = LT
; LT is the game's melee button, so melee moves here.
pad_melee = RS
; Slow walk on / off. Empty = none. On the same button as pad_tune_button, a quick
; tap toggles slow walk and holding it with another button tunes the camera.
pad_walk_toggle = LB
; Aim from a vehicle: a button, or LT / RT (light pull aims, full pull does its normal job).
pad_vehicle_aim = LB
; Right stick turn speed in radians per second (left / right, up / down), before
; the game's look sensitivity. Aiming and vehicles use the same speed.
pad_hip_speed_x = 3.6
pad_hip_speed_y = 2.2
; Right stick deadzone.
pad_deadzone = 0.08
; Higher = finer control near the centre of the stick.
pad_aim_curve = 1.8
; Holding the stick fully left or right turns this much faster after a moment. 0 = off.
pad_turn_boost = 0.5
; 1 = the mod turns the camera from the right stick (smooth curve, no acceleration).
; 0 = the game's own stick handling. Not aiming / aiming / in vehicles.
pad_hip_direct = 1
pad_aim_direct = 1
pad_vehicle_direct = 1

; ---------------------------------------------------------------------------
; Precise aim and movement
; ---------------------------------------------------------------------------
; How fast the aim camera comes in. Higher = snappier.
aim_speed = 8.0
; Seconds standing still while aiming before the gun goes to the shoulder.
aim_settle_delay = 0.5
; Controller: how far you push the move stick before precise aim goes back to normal
; aim. 1.0 = only a full push. Keys always push fully, so they always leave it.
precise_exit_push = 0.95
; Controller: walking with the stick pushed no further than this counts as slow
; walking and goes into precise aim. 0 = off.
precise_walk_push = 0.7
; 1 = your body turns to face where you aim (precise aim, grenades, melee). 0 = never.
face_aim = 1
; How far (degrees) your body may turn away from the aim while moving.
aim_body_max = 20
; How far the move stick goes while slow walking. 1.0 = no limit.
slow_walk_stick = 0.45
; Seconds the precise aim walk animations take to blend into each other.
; Higher = smoother, lower = snappier.
strafe_blend = 0.25
; Milliseconds a strafe direction is kept before it may change again.
strafe_hold_ms = 150
; Milliseconds with no movement before he stops (changing keys does not stop him).
strafe_stop_ms = 120

; ---------------------------------------------------------------------------
; Grenades and melee weapons
; ---------------------------------------------------------------------------
; 1 = aim with grenades; left click / RT throws.
grenade_aim = 1
; 1 = raise the grenade while aiming.
grenade_raise = 1
; 1 = aim with melee weapons; left click / RT swings.
melee_aim = 1
; 1 = raise the melee weapon while aiming.
melee_raise = 0

; ---------------------------------------------------------------------------
; Vehicles and crosshair
; ---------------------------------------------------------------------------
; Field of view while aiming from a vehicle. 1.0 = no zoom.
vehicle_fov = 0.85
; 1 = the crosshair grows and shrinks with your accuracy (guns).
; 0 = it only shrinks while aiming, to aim_reticle_scale.
reticle_follows_cone = 1
aim_reticle_scale = 0.8
vehicle_reticle_scale = 0.7

; ---------------------------------------------------------------------------
; Accuracy
; ---------------------------------------------------------------------------
; 1 = shot spread follows what you are doing. Each number multiplies the gun's own
; spread: smaller = more accurate. 0 = the game's own accuracy.
cone_model = 1
cone_stand_hip = 1.00
cone_stand_ads = 0.40
cone_crouch_hip = 0.80
cone_crouch_ads = 0.30
cone_move_hip = 1.60
cone_move_ads = 0.70
cone_crouch_move_hip = 1.30
cone_crouch_move_ads = 0.55
cone_slowwalk_hip = 1.25
cone_slowwalk_ads = 0.55
cone_crouch_slowwalk_hip = 1.05
cone_crouch_slowwalk_ads = 0.45
cone_sprint = 2.00
cone_vehicle_hip = 2.00
cone_vehicle_ads = 1.00

; ---------------------------------------------------------------------------
; Camera tuning in game (saved to camera.cfg)
; ---------------------------------------------------------------------------
; 1 = the keys below change the aim camera while you play. Empty key = off.
tune_keys = 0
key_zoom_in = MINUS
key_zoom_out = PLUS
key_fov_wide = PAGEUP
key_fov_narrow = PAGEDOWN
key_height_down = HOME
key_height_up = END
key_shoulder_left = CTRL+I
key_shoulder_right = CTRL+O
key_preset_reset = CTRL+J
key_preset_prev = CTRL+K
key_preset_next = CTRL+Y
key_preset_save = CTRL+U
key_preset_clear = CTRL+G
; Controller: hold pad_tune_button and press one of these.
pad_tune_button = LB
pad_zoom_in = Y
pad_zoom_out = A
pad_fov_wide = B
pad_fov_narrow = X
pad_height_down = DPAD_DOWN
pad_height_up = DPAD_UP
pad_shoulder_left = DPAD_LEFT
pad_shoulder_right = DPAD_RIGHT
pad_preset_reset = RS
pad_preset_prev =
pad_preset_next = RB
pad_preset_save = START
pad_preset_clear = BACK
