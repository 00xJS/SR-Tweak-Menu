; Precise Aim camera presets
;
; One [block] per preset. In game, Ctrl+K / Ctrl+Y (or hold LB + click RB on a controller)
; step through them in file order, followed by the ones you saved (my_presets.ini).
; To share a preset, copy its block. To add one, paste it at the end of this file
; and restart the game. To start on it, set "preset = <name>" in mod.ini.
;
;   style     orbit = the camera circles your character's head, like Saints Row 1's
;                     own aim camera. zoom 0.00 = 1.85 m behind the head.
;             zoom  = the normal camera is pulled in toward you.
;   zoom      0.00 = no pull-in. Every -2.0 halves the distance. Range -3.50 to 0.00.
;   fov       Field of view while aiming, as a fraction of the normal one.
;             0.60 = 40% narrower. Range 0.50 to 1.00.
;   height    Camera height above your feet, in metres. Range 0.80 to 2.60.
;   shoulder  Sideways offset, in metres. Positive = right shoulder. Range -1.50 to 1.50.

; Saints Row 1's own aim camera (camera_first_mode).
[SR1]
style = orbit
zoom = 0.00
fov = 0.60
height = 1.69
shoulder = 0.35

; Saints Row 2 style.
[SR2]
style = zoom
zoom = -2.75
fov = 0.75
height = 1.50
shoulder = 0.70

; Saints Row: The Third style.
[SR3]
style = zoom
zoom = -3.29
fov = 0.60
height = 1.70
shoulder = 0.60

; Saints Row IV style.
[SR4]
style = zoom
zoom = -2.17
fov = 0.60
height = 1.65
shoulder = 0.60

; Saints Row (2022) style.
[SR2022]
style = zoom
zoom = -2.89
fov = 0.62
height = 1.34
shoulder = 0.52

; Gentle third-person aim.
[TPA]
style = zoom
zoom = -1.20
fov = 0.85
height = 1.70
shoulder = 0.45
