[mod]
name = SR Tweak Menu
author = 00xJS
version = 0.3
description = An in-game menu (F5) for Saints Reborn: god mode, wanted level, infinite ammo and no reload, every weapon, vehicle god mode, nitrous in every car, spawn any of the game's 84 vehicles, crowds of people, 21 teleport spots, weather, time, visual filters and more, plus handling, weapon and on-foot tweaks. Every number lives under [settings] in this mod's mod.ini; restart the game after changing them.

B switches every runtime tweak off and on, 1 to 7 are shortcuts, 0 shows what is on. Private play only, like any gameplay mod.

[settings]
; ---- Vehicles ----
; Give every vehicle the same top speed and the same pull-away (true), instead of scaling each one's own numbers (false).
; Off: traffic, cops and gangs keep their own cars; only the car you drive is boosted (player_torque_multiplier, vehicle_tank).
vehicle_uniform = false
; The shared top speed, in mph (the game's cars go 30 to 100; mission scripts use up to 130).
vehicle_uniform_speed = 140
; The car whose engine and gearbox every vehicle gets in uniform mode (the game's fastest: car_2dr_exoticsports01).
vehicle_reference = car_2dr_exoticsports01
; How much harder than the reference car everything pulls away (1.0 = like the reference car).
vehicle_acceleration_multiplier = 1.0
; Give every vehicle nitrous (Shift), so any car you take has it.
vehicle_nitrous_everywhere = true
; Fallback torque per kilogram if the reference car is not found.
vehicle_torque_per_kg = 0.45
; --- used only when vehicle_uniform = false ---
; Multiplier for every vehicle's top speed (1.0 = the game's own).
vehicle_speed_multiplier = 1.0
; Lowest top speed any vehicle gets, in mph, after the multiplier (0 = no floor).
vehicle_speed_min = 0
; Top speed cap for every vehicle, in mph, after the multiplier (0 = no cap).
; The game's own cars go from 30 to 100. Mission scripts use up to 130;
; above that the engine may hold cars back regardless of this table.
vehicle_speed_max = 0
; Multiplier for engine torque, so cars can actually reach the new speed (1.0 = normal).
vehicle_torque_multiplier = 1.0
; Extra downforce added to every vehicle, in m/s^2, so fast cars stay on the road (0 = none; the game already uses 20 on most cars).
vehicle_extra_gravity = 5
; Also raise the speed at which steering lock starts to fall off, in step with the top speed.
vehicle_scale_steering = true
; Multiplier for every vehicle's hitpoints (1.0 = normal). Cars take longer to look wrecked and to blow up; this applies to other cars too.
vehicle_hitpoints_multiplier = 1
; Nitrous strength for the vehicle you drive only (1.0 = normal). The game's own multiplier field; it acts while boosting (Shift).
player_torque_multiplier = 1.5
; Make the vehicle you drive immovable in collisions, so other cars bounce off it (true/false). Uses the game's own "infinite mass" mission effect.
vehicle_tank = true

; ---- Weapons ----
; Multiplier for the damage guns, bats and fists do to people (1.0 = normal). Damage to you is unchanged,
; but the weapon tables are shared: enemies' guns hurt your homies by the same multiplier. Leave at 1 with homies.
damage_multiplier = 1
; Multiplier for how hard shots fling people (1.0 = normal).
ragdoll_force_multiplier = 3
; Multiplier for how hard melee hits fling people (1.0 = normal). This one is shared with hits on you, so leave it at 1.
melee_impulse_multiplier = 1
; How much damage it takes to knock you down or send you flying, as a multiple of normal (100 = practically never).
player_knockdown_multiplier = 100
; Multiplier for enemies' hit points (1.0 = normal, 0.2 = one fifth). Makes every hit, bullet or bat, count for more.
; Street-recruited homies share the gang ranks (Thug/Killa/Gangsta/Kingpin), so this cuts their health too. Leave at 1 with homies.
npc_health_multiplier = 1
; Multiplier for your own hit points and knockdown resistance (1.0 = normal).
player_health_multiplier = 3
; Fire rate multiplier for the player's guns (2.0 = twice as fast). Melee and thrown weapons are untouched.
fire_rate_multiplier = 2.0
; Extra fire rate multiplier for shotguns on top of the one above (their pump is slow).
shotgun_fire_rate_multiplier = 2.0
; Shortest allowed time between shots, in milliseconds.
fire_delay_min = 40
; Make every gun fire while the trigger is held by changing its trigger type (true). Guns changed this way play their shot sound only once per pull; auto_fire below keeps the sound.
full_auto = false
; Also speed up enemies' guns by the same amount.
npc_fire_rate = false
; Smallest magazine any gun gets, so one-shot weapons like the RPG and revolvers don't reload after every shot (0 = leave magazines alone).
min_magazine = 8
; Bullet spread multiplier for the player's guns (1.0 = normal, 0.05 = near perfect, 0 = perfect). Enemies keep theirs.
spread_multiplier = 0.05

; Auto fire (main.lua): while you hold fire on foot, the trigger is tapped for you where the game reads the controller, so single-shot guns (pistols, shotguns, RPG) fire repeatedly with their normal sound and animation.
auto_fire = true
; Taps per second while the button is held.
auto_fire_rate = 12

; ---- Crouch ----
; How quickly the camera drops when crouching (1.0 = normal; 3.0 is near instant).
crouch_speed_multiplier = 3.0

; ---- Sprint ----
; Multiplier for how long you can sprint (1.0 = normal; 0 = unlimited).
sprint_length_multiplier = 2.0
; Multiplier for how long the sprint meter takes to refill (1.0 = normal; lower is faster).
sprint_recharge_multiplier = 0.5

; ---- On foot (experimental, main.lua) ----
; Run boost on at start (true/false). It moves you a little further each update, which can look like a stutter; off by default.
run_boost = false
; Multiplier for running and sprinting speed when Run boost is on (1.0 = normal; the menu has a slider). Walking slower than walk_speed is untouched.
run_speed_multiplier = 1.5
; Multiplier for how high you jump at start (1.0 = normal; the menu has a slider).
jump_multiplier = 4.0
; Land from any height without stumbling, ragdolling or taking fall damage (true/false).
soft_landing = true
; Fastest you can fall, in m/s, so landings never hurt (the game panics at 12; 0 = no limit).
max_fall_speed = 9
; Falling speed, in m/s, above which the player flails in the air (the game uses 12; 0 = leave it).
panic_fall_velocity = 100
; Speed in m/s above which the run multiplier applies (the game walks at about 1.5 and runs at about 4).
walk_speed = 2.5
; Moves bigger than this per update, in metres, are teleports or cutscenes and are ignored.
max_step = 1.0
; ---- Menu ----
; Key that opens and closes the menu ("" = none).
menu_key = F5
; Controller buttons that open and close the menu: hold the first ones, press the last ("" = none).
; Every controller reaches the game as an Xbox pad, so RB is R1 on a PlayStation pad.
; Names: A B X Y, LB RB LT RT, LS RS (stick clicks), BACK START, UP DOWN LEFT RIGHT (D-pad).
; PlayStation names work too: L1 R1 L2 R2 L3 R3, CROSS CIRCLE SQUARE TRIANGLE, SHARE OPTIONS.
; While the held buttons are down the last one is kept from the game (D-pad down is Cancel Activity).
; On the keyboard Shift is RB and the arrows are the D-pad, so Shift + Down also works.
menu_pad = RB+DOWN
; Rows shown per page.
menu_rows = 12
; While the menu is open the game gets no controller or movement input (true/false).
menu_blocks_input = true
; Draw the menu on screen through menu_overlay.dll (Windows). Set false to use one-line HUD messages instead.
menu_overlay = true

; ---- Keys (while playing; "" = none) ----
; Master switch for every runtime tweak.
toggle_key = B
; One feature each; the game shows a message on screen when you press them.
key_run = 1
key_jump = 2
key_landing = 3
key_tank = 4
key_torque = 5
key_fire = 6
; Shows what is on and off.
key_status = 0
; Sets the notoriety of every team in notoriety_teams to notoriety_level (0 to 5, 5 = the most).
; Teams: police, los_carnales, vice_kings, rollers. Single player only.
key_notoriety = 7
notoriety_level = 5
notoriety_teams = police, los_carnales, vice_kings, rollers
; How long on-screen messages stay, in seconds.
hud_seconds = 3

; Write what was changed, and once a second your measured speed on foot, to mods/wml.log.
debug = false
