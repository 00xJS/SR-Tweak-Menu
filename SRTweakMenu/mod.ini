[mod]
name = SR Tweak Menu
author = 00xJS, itsMJQ
version = 2.1
description = An in-game cheat menu for Saints Reborn: player, weapon and vehicle cheats, character homies, live model swap, movement styles, emotes, a free camera, teleports and more. Open with F5, hold Back/Select for 0.8 seconds, or RB (R1) + D-pad Down. Everything starts off. Private play only.

[settings]
; ---- Vehicles ----
; Give every vehicle the same top speed and the same pull-away (true), instead of scaling each one's own numbers (false).
; Off: traffic, cops and gangs keep their own cars; only the car you drive is changed (vehicle_tank).
vehicle_uniform = false
; The shared top speed, in mph (the game's cars go 30 to 100; mission scripts use up to 130).
vehicle_uniform_speed = 140
; The car whose engine and gearbox every vehicle gets in uniform mode (the game's fastest: car_2dr_exoticsports01).
vehicle_reference = car_2dr_exoticsports01
; How much harder than the reference car everything pulls away (1.0 = like the reference car).
vehicle_acceleration_multiplier = 1.0
; Nitrous in every car (Shift) switched on at start. The menu's Vehicles tab switches it any time.
vehicle_nitrous_everywhere = false
; Fallback torque per kilogram if the reference car is not found.
vehicle_torque_per_kg = 0.45
; --- used only when vehicle_uniform = false ---
; Multiplier for every vehicle's top speed (1.0 = the game's own).
vehicle_speed_multiplier = 1.0
; Lowest top speed any vehicle gets, in mph, after the multiplier (0 = no floor).
vehicle_speed_min = 0
; Top speed cap for every vehicle, in mph, after the multiplier (0 = no cap).
; The game's own cars go from 30 to 100. Mission scripts use up to 130;
; above that the engine may hold cars back regardless of this table.
vehicle_speed_max = 0
; Multiplier for engine torque, so cars can actually reach the new speed (1.0 = normal).
vehicle_torque_multiplier = 1.0
; Also raise the speed at which steering lock starts to fall off, in step with the top speed.
vehicle_scale_steering = true
; Multiplier for every vehicle's hitpoints (1.0 = normal). Cars take longer to look wrecked and to blow up; this applies to other cars too.
vehicle_hitpoints_multiplier = 1
; Tank mode switched on at start: the vehicle you drive is immovable in collisions. The menu's Vehicles tab switches it any time.
vehicle_tank = false

; ---- Weapons ----
; Multiplier for the damage guns, bats and fists do to people (1.0 = normal). Damage to you is unchanged,
; but the weapon tables are shared: enemies' guns hurt your homies by the same multiplier. Leave at 1 with homies.
damage_multiplier = 1
; Multiplier for how hard melee hits fling people (1.0 = normal). This one is shared with hits on you, so leave it at 1.
melee_impulse_multiplier = 1
; Multiplier for enemies' hit points (1.0 = normal, 0.2 = one fifth). Makes every hit, bullet or bat, count for more.
; Street-recruited homies share the gang ranks (Thug/Killa/Gangsta/Kingpin), so this cuts their health too. Leave at 1 with homies.
npc_health_multiplier = 1
; Make every gun fire while the trigger is held by changing its trigger type (true). Guns changed this way play their shot sound only once per pull; Rapid fire (auto_fire below) keeps the sound.
full_auto = false

; Rapid fire switched on at start: guns fire faster and single-shot guns keep firing while you hold the trigger. The menu's Weapons tab switches it any time.
auto_fire = false
; Rapid fire: trigger taps per second for single-shot guns while the button is held.
auto_fire_rate = 12

; ---- On foot (experimental, main.lua) ----
; Run boost on at start (true/false). It moves you a little further each update, which can look like a stutter; off by default.
run_boost = false
; Multiplier for running and sprinting speed when Run boost is on (1.0 = normal; the menu has a slider). Walking slower than walk_speed is untouched.
run_speed_multiplier = 1.5
; High jump switched on at start. The menu's Player tab switches it any time.
high_jump = false
; How much higher High jump makes you jump (the menu has a slider).
jump_multiplier = 4.0
; Soft landing switched on at start: land from any height without stumbling or fall damage. The menu's Player tab switches it any time.
soft_landing = false
; Fastest you can fall, in m/s, so landings never hurt (the game panics at 12; 0 = no limit).
max_fall_speed = 9
; Speed in m/s above which the run multiplier applies (the game walks at about 1.5 and runs at about 4).
walk_speed = 2.5
; Moves bigger than this per update, in metres, are teleports or cutscenes and are ignored.
max_step = 1.0

; ---- Add-ons (Weapons and Settings tabs; their own settings are in addons/<add-on>/settings.ini) ----
; Aim style at start: off (the game's own), precise (Precise Aim by Eazeepz) or fine (Fine Aim by car123609).
aim_style = off
; Weapon switch (by Eazeepz) switched on at start.
weapon_switch = false
; Aim button for both aim add-ons at start: own (each add-on's setting), toggle or hold.
aim_button = own
; Weapon switch: D-pad left/right switch weapons (switch) or stay the game's taunts (taunts).
weapon_dpad = switch
; Weapon switch: a tap of the wheel button gives the next weapon (next) or does nothing (wheel).
weapon_tap = next
; Precise Aim's turning: game (the normal game's, it only changes it while you aim) or precise (its own).
; The menu saves this when you change it.
precise_turning = game
; Camera turn speed (the game's look sensitivity, 0.5 to 2.0; 0 = leave the game's own). The menu saves it.
camera_turn_speed = 0

; ---- Homies ----
; How many homies can follow you, 1 to 10 (0 = the game's own 1 to 3). The menu's Player tab changes it too.
; With the More Homies mod ticked as well, this number wins and More Homies handles recruiting and the HUD heads.
homie_limit = 0

; ---- Teleport to waypoint ----
; Teleport whenever you set a waypoint on the pause map (the menu's Teleport tab switches it too).
; Stays off while the standalone Teleport to Waypoint mod is ticked, so a waypoint never moves you twice.
waypoint_teleport = false
; Close the pause map by itself once the waypoint is set, so the move starts at once.
waypoint_close_map = true

; ---- Menu ----
; Key that opens and closes the menu ("" = none).
menu_key = F5
; Controller buttons that open and close the menu: hold the first ones, press the last ("" = none).
; Every controller reaches the game as an Xbox pad, so RB is R1 on a PlayStation pad.
; Names: A B X Y, LB RB LT RT, LS RS (stick clicks), BACK START, UP DOWN LEFT RIGHT (D-pad).
; PlayStation names work too: L1 R1 L2 R2 L3 R3, CROSS CIRCLE SQUARE TRIANGLE, SHARE OPTIONS.
; While the held buttons are down the last one is kept from the game (D-pad down is Cancel Activity).
; On the keyboard Shift is RB and the arrows are the D-pad, so Shift + Down also works.
menu_pad = RB+DOWN
; Hold Xbox Back/View or PlayStation Select/Share (mapped to Back) to open/close.
; Short taps still reach the game on release. Disable to keep the original Back timing.
menu_hold_back = true
menu_hold_seconds = 0.8
; Controller buttons that stop a pose or a repeating action (the same names as menu_pad).
; On the keyboard Shift is RB and the arrows are the D-pad, so Shift + Up also works.
stop_pad = RB+UP
; Rows shown per page.
menu_rows = 12
; While the menu is open the game gets no controller or movement input (true/false). Outside Customize you can still move:
; the sticks, triggers and other buttons stay the game's, and the D-pad, A, B, LB, RB, Start, Back (and arrows, Enter, Backspace) are the menu's.
menu_blocks_input = true
; Draw the menu on screen through menu_overlay.dll (Windows, and Mac under Wine). Set false to use one-line HUD messages instead.
menu_overlay = true

; ---- Messages ----
; How long on-screen messages stay, in seconds.
hud_seconds = 3

; Write what was changed, and once a second your measured speed on foot, to mods/wml.log.
debug = false
